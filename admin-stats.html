<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>RigRoute · Active users (admin)</title><style>body{font:16px system-ui;background:#0d1117;color:#e6edf3;max-width:760px;margin:auto;padding:16px}.k{display:flex;gap:12px}.k div{flex:1;background:#161b22;border-radius:10px;padding:12px}.k b{font-size:32px;display:block}svg{background:#161b22;border-radius:10px;width:100%}a{color:#58a6ff}</style></head><body>
<h1>Active users</h1><p id="who">Loading…</p><div class="k"><div>Today (DAU)<b id="dau">–</b></div><div>Last 7 days (WAU)<b id="wau">–</b></div></div><h3>Last 30 days</h3><svg id="ch" viewBox="0 0 600 200"></svg>
<h3>By area</h3><table id="ar" style="width:100%"><tr><th align=left>State</th><th align=left>City / metro</th><th>Today</th><th>7 days</th><th>30 days</th></tr></table><p class="small">Areas with fewer than 3 users are hidden; counts under 3 show as "&lt;3". Counts unique devices per day (random ID, no location or IP). Days are UTC. <a href="bug-reports.html">Bug reports</a> · <a href="./">App</a></p>
<script type="module">
import { sb, uid } from './js/cloud.js'; const $ = s => document.querySelector(s);
const c = await sb(); if (!(await uid())) $('#who').textContent = 'Sign in to RigRoute as an admin first (Me > Account), then reload this page.';
else { const [{ data: rows, error }, { data: wau }] = await Promise.all([c.rpc('active_stats'), c.rpc('active_wau')]);
  if (error) $('#who').textContent = 'Admins only.'; else { $('#who').textContent = 'Signed in as admin.'; const esc = v => String(v).replace(/[&<>"']/g, ch => '&#' + ch.charCodeAt(0) + ';'); const { data: ar } = await c.rpc('active_by_area'); $('#ar').insertAdjacentHTML('beforeend', (ar || []).map(r => `<tr><td>${esc(r.region)}</td><td>${esc(r.metro)}</td><td align=center>${r.today ?? '&lt;3'}</td><td align=center>${r.week ?? '&lt;3'}</td><td align=center>${r.month}</td></tr>`).join('') || '<tr><td colspan=5>No area has 3+ users yet.</td></tr>'); $('#dau').textContent = rows.at(-1)?.users ?? 0; $('#wau').textContent = wau ?? 0;
    const mx = Math.max(1, ...rows.map(r => +r.users)), w = 600 / rows.length; $('#ch').innerHTML = rows.map((r, i) => { const h = 170 * r.users / mx; return `<rect x="${i * w + 2}" y="${180 - h}" width="${w - 4}" height="${h}" fill="#ff9500"><title>${r.day}: ${r.users}</title></rect>`; }).join('') + `<text x="4" y="196" fill="#8b949e" font-size="11">${rows[0]?.day}</text><text x="596" y="196" fill="#8b949e" font-size="11" text-anchor="end">${rows.at(-1)?.day}</text>`; } }
</script></body></html>
