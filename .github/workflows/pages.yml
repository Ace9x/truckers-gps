name: Build & deploy (refresh official work-zone data every 30 min)
on:
  push: { branches: [main] }
  schedule: [{ cron: '*/30 * * * *' }]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --test test/unit.test.js test/offline.test.js
      - run: node scripts/build-closures.mjs || true
      - run: node scripts/build-eia.mjs || true
      - run: mkdir -p _site && cp -r index.html dispatch.html docs manifest.webmanifest sw.js css js icons data _site/ && rm -f _site/data/*.sh _site/data/*.log _site/data/raw*.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
