<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com https://esm.sh 'sha256-pVKdWG06hz7lzeO1UNk+jgUSev5zNbVAdoz76kSBaBk='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>RigRoute · Bug reports (admin)</title>
<style>body{font:15px system-ui,sans-serif;margin:16px;background:#111;color:#eee}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #333;padding:6px;vertical-align:top;text-align:left}a{color:#6cf}select,button{font:inherit}.muted{color:#999}</style></head>
<body><h1>Bug reports &amp; suggestions</h1><p id="who" class="muted">Loading…</p>
<label>Show <select id="f"><option value="new">New</option><option value="">All</option><option value="triaged">Triaged</option><option value="fixed">Fixed</option><option value="wontfix">Won't fix</option></select></label> <button id="r">Refresh</button>
<table><thead><tr><th>When (ET)</th><th>Type</th><th>App</th><th>Description</th><th>Page</th><th>Contact</th><th>Shot</th><th>Status</th></tr></thead><tbody id="t"></tbody></table>
<script type="module">
import { sb, uid } from './js/cloud.js';
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const c = await sb();
async function load() { if (!(await uid())) { $('#who').textContent = 'Sign in to RigRoute as an admin first (Me > Account), then reload this page.'; return; }
  const { data: admin } = await c.rpc('is_admin'); $('#who').textContent = admin ? 'Signed in as admin.' : 'You are not an admin, so you only see your own reports.';
  let q = c.from('bug_reports').select('*').order('created_at', { ascending: false }).limit(200); if ($('#f').value) q = q.eq('status', $('#f').value);
  const { data, error } = await q; if (error) { $('#who').textContent = error.message; return; }
  const rows = await Promise.all(data.map(async r => { let shot = ''; if (r.screenshot_path) { const { data: u } = await c.storage.from('bug-shots').createSignedUrl(r.screenshot_path, 3600); if (u) shot = `<a href="${esc(u.signedUrl)}" target="_blank" rel="noopener">view</a>`; }
    const st = admin ? `<select data-id="${r.id}">${['new', 'triaged', 'fixed', 'wontfix'].map(s => `<option ${s === r.status ? 'selected' : ''}>${s}</option>`).join('')}</select>` : esc(r.status);
    return `<tr><td>${new Date(r.created_at).toLocaleString('en-US', { timeZone: 'America/New_York' })}</td><td>${esc(r.kind)}</td><td>${esc(r.app)}</td><td>${esc(r.description)}</td><td class="muted">${esc(r.page_url)}</td><td>${esc(r.contact)}</td><td>${shot}</td><td>${st}</td></tr>`; }));
  $('#t').innerHTML = rows.join('') || '<tr><td colspan="8" class="muted">No reports.</td></tr>';
  document.querySelectorAll('select[data-id]').forEach(s => s.onchange = async () => { const { error } = await c.from('bug_reports').update({ status: s.value }).eq('id', s.dataset.id); if (error) alert(error.message); }); }
$('#r').onclick = load; $('#f').onchange = load; load();
</script></body></html>
